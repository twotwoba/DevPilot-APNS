# DevPilot relay 的 EC2 单机部署。
#
#   cp .env.example .env
#   mkdir -p secrets && cp ~/AuthKey_XXXX.p8 secrets/apns.p8 && chmod 600 secrets/apns.p8
#   docker compose pull && docker compose up -d
#
# 镜像从 GHCR 拉取（0.4 浮动 tag 随 v0.4.x patch 发版更新；minor 升级需改此行）。
# Caddy 负责 TLS 与 WSS 反代；relay 只监听容器内网 8080，不暴露到公网。

services:
  relay:
    image: ghcr.io/twotwoba/devpilot-relay:0.4
    container_name: devpilot-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_ADDR: :8080
      DATA_DIR: /data
    volumes:
      - relay-data:/data
      - ./secrets/apns.p8:/run/secrets/apns.p8:ro
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.8-alpine
    container_name: devpilot-caddy
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  relay-data:
  caddy-data:
  caddy-config:
